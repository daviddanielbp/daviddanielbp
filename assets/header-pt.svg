<defs>
<style>@font-face{font-family:'BG';font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IS';font-style:italic;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JB';font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GE';font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
